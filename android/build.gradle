plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.openwearables'
version = '0.1.0'

android {
  namespace "expo.modules.openwearables"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation("com.github.horakivo.open_wearables_android_sdk:sdk:b61d88867e")
}